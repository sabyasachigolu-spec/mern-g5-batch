<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    nav {
        border-bottom: 1px solid lightgrey;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 60px;
        height: 70px;
        position: fixed;
        width: 100%;
        background-color: white;
    }

    .logo {
        color: green;
        font-size: 24px;
        font-weight: 700;
    }

    .input-section {
        width: 40%;
    }

    .input-section input {
        width: 100%;
        border-radius: 10px;
        border: 1px solid lightgray;
        padding: 14px;
    }

    .items {
        display: flex;
        width: 20%;
        justify-content: space-between;
    }

    .items li {
        list-style: none;
    }

    .items li:hover {
        cursor: pointer;
    }

    .hero {
        /* height: 50vh; */
        background: linear-gradient(to right, #d8f3dc, #b7e4c7);
        border-radius: 20px;
        margin: 0 60px 20px 60px;
        padding: 50px;
        display: flex;
        justify-content: space-between
    }

    .hero h1 {
        font-size: 48px;
        margin-bottom: 20px;
    }

    .hero p {
        font-size: 18px;
        color: rgb(70, 68, 68);
        margin-bottom: 20px;
    }

    .hero button {
        background-color: green;
        color: white;
        padding: 13px 30px;
        border: none;
        border-radius: 10px;
    }

    .hero button:hover {
        cursor: pointer;
    }

    .cart {
        font-size: 128px;
    }

    .cart img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
    }

    .category {
        padding: 20px 60px;
        border-bottom: 1px solid lightgrey;
        position: sticky;
        top: 70px;
        background-color: white;
    }

    .category h1{
        margin-bottom: 20px;
    }

    .fruit-box {
        height: 80px;
        width: 80px;
        border-radius: 50%;
        background-color: #d8f3dc;
        margin-bottom: 10px;
    }

    .cat-container {
        display: flex;
        width: 40%;
        justify-content: space-between;
    }

    .fruit-box{
        font-size: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .cat-container p {
        text-align: center;
    }
    main{
        padding-top: 70px;
        background-color: rgb(243, 243, 243);
    }

    .dummy{
        height: 100vh;
    }
</style>

<body>
    <nav>
        <div class="logo">FreshMart</div>
        <div class="input-section">
            <input type="text" placeholder="Search fruits, vegitable...">
        </div>
        <div class="items">
            <li>Home</li>
            <li>Products</li>
            <li>Cart</li>
        </div>
    </nav>


    <main>
        <div class="hero">
            <div class="hero-content">
                <h1>Fresh groceries<br>delivered to you.</h1>
                <p>Fruits, vegetables and daily essentials delivered fresh.</p>
                <button>Shop Now</button>
            </div>
